name: vNext focused CPU
on:
  pull_request:
  push:
    branches: ['dev/dev12-vnext-hue-*']
permissions:
  contents: read
jobs:
  focused-cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate v3 candidate
        run: |
          python3 adapters/ofx/regenerate.py
          python3 adapters/ofx/generate_descriptors.py
      - name: Static-check Windows candidate harness
        run: |
          python3 -m py_compile adapters/ofx/compile_cuda.py adapters/ofx/tests/verify_cuda_v3.py adapters/ofx/tests/verify_cuda_adapter_v3.py adapters/ofx/tests/verify_package_v3.py
          python3 - <<'PY'
          from pathlib import Path
          plugin=Path('adapters/ofx/src/Plugin.cpp').read_text()
          cmake=Path('adapters/ofx/CMakeLists.txt').read_text()
          compile_cuda=Path('adapters/ofx/compile_cuda.py').read_text()
          assert 'com.46slv.PressMachine.v3.dev' in plugin
          assert 'PressMachineV3Dev.ofx.bundle' in cmake
          assert 'OUTPUT_NAME "PressMachineV3Dev"' in cmake
          assert "results/v3" in compile_cuda.replace("\\","/")
          print('Windows v3.dev static contracts PASS')
          PY
      - name: Focused source and generated-DCTL qualification
        run: python3 adapters/ofx/tests/verify_vnext.py
      - name: Alpha and extreme values
        run: python3 adapters/ofx/tests/verify_alpha_v3.py

  focused-windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and qualify with runner Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere not found: $vswhere" }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "Visual Studio with C++ tools not found" }
          $devShell = Join-Path $vs "Common7\Tools\Launch-VsDevShell.ps1"
          if (-not (Test-Path $devShell)) { throw "Visual Studio DevShell not found: $devShell" }
          & $devShell -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          python adapters/ofx/regenerate.py
          python adapters/ofx/generate_descriptors.py
          python adapters/ofx/tests/verify_vnext.py
          python adapters/ofx/tests/verify_alpha_v3.py
