name: vNext core
on:
  push:
    branches: [docs/vnext-comp-hue-density-spec-20261109]
  pull_request:
    paths:
      - 'parameters/press_machine_vnext.json'
      - 'core/press_machine/*VNext*'
      - 'adapters/vnext/**'
      - 'adapters/ofx_vnext/**'
      - '.github/workflows/vnext-core.yml'
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generate vNext core
        run: python adapters/vnext/regenerate.py
      - name: Independent geometry/scalar reference
        run: python adapters/vnext/tests/reference_geometry.py
      - name: Compile shared C++ core
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic adapters/vnext/tests/CoreSmoke.cpp -o /tmp/pm-vnext-smoke
      - name: Run shared C++ smoke
        run: /tmp/pm-vnext-smoke
      - name: Compile CPU adapter harness
        run: g++ -std=c++17 -O2 -Wall -Wextra -fPIC -shared adapters/ofx_vnext/tests/Native.cpp -o /tmp/libpmvnext.so
      - name: Focused CPU pipeline checks
        env:
          PM_VNEXT_NATIVE: /tmp/libpmvnext.so
        run: python adapters/ofx_vnext/tests/verify_cpu.py
      - name: Static-check Windows OFX/CUDA harness
        run: |
          python -m py_compile adapters/ofx_vnext/compile_cuda.py adapters/ofx_vnext/tests/verify_cuda_adapter.py
          python - <<'PY'
          from pathlib import Path
          plugin=Path('adapters/ofx_vnext/src/Plugin.cpp').read_text()
          runner=Path('adapters/ofx_vnext/src/CudaRunner.cpp').read_text()
          kernel=Path('adapters/ofx_vnext/src/Kernel.cu').read_text()
          cmake=Path('adapters/ofx_vnext/CMakeLists.txt').read_text()
          assert 'com.46slv.PressMachine.vnext.test' in plugin
          assert 'PressMachineVNextKernel' in kernel and 'PressMachineVNextKernel' in runner
          assert 'PressMachineVNext.ofx.bundle' in cmake and 'OUTPUT_NAME "PressMachineVNext"' in cmake
          assert 'Resolve-bundled' not in plugin  # no runtime documentation text in implementation source
          print('Windows OFX/CUDA static contracts PASS')
          PY
      - name: Check generated DCTL and OFX parameter contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('adapters/vnext/generated/PressMachine_vNext_TEST.dctl')
          s=p.read_text()
          assert 'Hue Pattern' in s and 'Hue Bias' in s and 'Luma Split' in s
          assert 'Hue Points' not in s
          line=next(x for x in s.splitlines() if x.startswith('__DEVICE__ float3 transform('))
          assert 'p_Width' in line and line.rstrip().endswith('{')
          d=Path('adapters/vnext/generated/Descriptors.hpp').read_text()
          assert 'Comp Skin Protect' in d and 'Look Skin Protect' in d
          print('generated contracts PASS',p.stat().st_size)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: PressMachine-vNext-${{ github.sha }}
          path: |
            adapters/vnext/generated/PressMachine_vNext_TEST.dctl
            adapters/vnext/generated/GENERATION.json
            adapters/vnext/results/REFERENCE_GEOMETRY.json
            adapters/ofx_vnext/results/CPU_VNEXT.json
